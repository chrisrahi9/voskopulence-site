name: Build seamless v6_3 preview

on:
  push:
    branches:
      - preview/hero-v6-3-internal-loop
    paths:
      - .github/workflows/build-v6-3-seamless-preview.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/hero-v6-3-internal-loop

      - name: Download source hero
        run: |
          curl -L --fail --retry 3 \
            'https://vosko-cdn.b-cdn.net/hero_web_v6_3.mp4' \
            -o hero_web_v6_3.mp4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render smooth single-file loop
        run: |
          ffmpeg -y -i hero_web_v6_3.mp4 \
            -filter_complex "[0:v]trim=start=1.2:end=10.662,settb=AVTB,setpts=PTS-STARTPTS,fps=60000/1001,scale=1920:1080:flags=lanczos[main];[0:v]trim=start=10.662:end=11.862,settb=AVTB,setpts=PTS-STARTPTS,fps=60000/1001,scale=1920:1080:flags=lanczos[tail];[0:v]trim=start=0:end=1.2,settb=AVTB,setpts=PTS-STARTPTS,fps=60000/1001,scale=1920:1080:flags=lanczos[head];[tail][head]xfade=transition=fade:duration=1.2:offset=0[xf];[main][xf]concat=n=2:v=1:a=0,format=yuv420p[outv]" \
            -map "[outv]" -an \
            -c:v libx264 -preset medium -crf 19 \
            -profile:v high -level 4.2 \
            -movflags +faststart \
            stackblitz-starters-n2un17vw/public/hero_web_v6_3_seamless.mp4

      - name: Commit rendered preview asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stackblitz-starters-n2un17vw/public/hero_web_v6_3_seamless.mp4
          git commit -m 'Add seamless v6_3 hero preview asset' || exit 0
          git push origin HEAD:preview/hero-v6-3-internal-loop
