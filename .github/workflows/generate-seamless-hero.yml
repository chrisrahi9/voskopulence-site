name: Generate seamless slow hero

on:
  push:
    branches:
      - fix/video-curtain-stability-20260912
    paths:
      - .github/workflows/generate-seamless-hero.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build seamless 60fps loop
        run: |
          in="stackblitz-starters-n2un17vw/public/media/hero_web_v4_slow.mp4"
          out="stackblitz-starters-n2un17vw/public/media/hero_web_v5_seamless.mp4"
          ffmpeg -y -i "$in" -an -filter_complex \
            "[0:v]split=3[a][b][c];\
             [a]trim=start=0.50:end=3.6667,setpts=PTS-STARTPTS[main];\
             [b]trim=start=3.6667:end=4.1667,setpts=PTS-STARTPTS[tail];\
             [c]trim=start=0:end=0.50,setpts=PTS-STARTPTS[head];\
             [tail][head]blend=all_expr='A*(1-T/0.50)+B*(T/0.50)':shortest=1[bridge];\
             [main][bridge]concat=n=2:v=1:a=0,fps=60[outv]" \
            -map "[outv]" -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -movflags +faststart "$out"
          ffprobe -v error -show_entries stream=width,height,avg_frame_rate -show_entries format=duration,size -of default=nw=1 "$out"
      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin fix/video-curtain-stability-20260912
          git add stackblitz-starters-n2un17vw/public/media/hero_web_v5_seamless.mp4
          git commit -m "Add seamless 60fps slow hero loop"
          git push
