name: Generate smooth slow-motion hero

# One-off branch workflow for producing a smooth, slower hero derivative.
on:
  push:
    branches:
      - fix/video-curtain-stability-20260912
    paths:
      - .github/workflows/generate-slow-hero.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download current Bunny hero
        run: curl -L --fail --retry 3 https://vosko-cdn.b-cdn.net/hero_web_v3.mp4 -o /tmp/hero_web_v3.mp4

      - name: Inspect source
        run: ffprobe -v error -show_entries stream=width,height,r_frame_rate,avg_frame_rate -show_entries format=duration,size -of default=nw=1 /tmp/hero_web_v3.mp4

      - name: Generate smoother slower hero
        run: |
          mkdir -p stackblitz-starters-n2un17vw/public/media
          ffmpeg -y -i /tmp/hero_web_v3.mp4 \
            -an \
            -vf "setpts=1.5*PTS,minterpolate=fps=60:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1" \
            -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p \
            -movflags +faststart \
            stackblitz-starters-n2un17vw/public/media/hero_web_v4_slow.mp4

      - name: Check generated file
        run: |
          ls -lh stackblitz-starters-n2un17vw/public/media/hero_web_v4_slow.mp4
          size=$(stat -c%s stackblitz-starters-n2un17vw/public/media/hero_web_v4_slow.mp4)
          if [ "$size" -ge 95000000 ]; then
            echo "Generated video is too large for a normal GitHub commit: $size bytes"
            exit 1
          fi

      - name: Commit generated hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stackblitz-starters-n2un17vw/public/media/hero_web_v4_slow.mp4
          git commit -m "Add interpolated slow-motion hero [skip hero-gen]"
          git push
