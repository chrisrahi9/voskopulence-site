name: Generate Topaz 0.75x web hero

on:
  push:
    branches:
      - fix/topaz-hero-web-20260912
    paths:
      - .github/workflows/generate-topaz-075-web-hero.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download Topaz 60fps master
        run: curl -L --fail --retry 3 https://vosko-cdn.b-cdn.net/hero_web_v4_enhanced_fps.mp4 -o /tmp/hero_topaz_60_master.mp4
      - name: Build 1080p 0.75x 60fps seamless web version
        run: |
          mkdir -p stackblitz-starters-n2un17vw/public/media
          tmp="/tmp/hero_topaz_075_slow.mp4"
          out="stackblitz-starters-n2un17vw/public/media/hero_web_v10_topaz60_075x_seamless.mp4"

          # Preserve Topaz's 60fps motion and slow only to 0.75x.
          # This requires far fewer synthesized in-between frames than the 0.60x version.
          ffmpeg -y -i /tmp/hero_topaz_60_master.mp4 -an \
            -vf "scale=1920:1080:flags=lanczos,setpts=1.3333333*PTS,minterpolate=fps=60:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:me=epzs:mb_size=8:search_param=32:vsbmc=1" \
            -c:v libx264 -preset slow -crf 19 -maxrate 12M -bufsize 24M \
            -pix_fmt yuv420p -profile:v high -level 4.2 -movflags +faststart "$tmp"

          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$tmp")
          B=0.45
          T=$(python3 -c "print(max(0.46, float('$D') - float('$B')))" )
          echo "slow master duration=$D blend=$B tail_start=$T"

          ffmpeg -y -i "$tmp" -an -filter_complex \
            "[0:v]split=3[a][b][c];\
             [a]trim=start=${B}:end=${T},setpts=PTS-STARTPTS[main];\
             [b]trim=start=${T}:end=${D},setpts=PTS-STARTPTS[tail];\
             [c]trim=start=0:end=${B},setpts=PTS-STARTPTS[head];\
             [tail][head]blend=all_expr='A*(1-T/${B})+B*(T/${B})':shortest=1[bridge];\
             [main][bridge]concat=n=2:v=1:a=0,fps=60[outv]" \
            -map "[outv]" -c:v libx264 -preset slow -crf 20 -maxrate 12M -bufsize 24M \
            -pix_fmt yuv420p -profile:v high -level 4.2 -movflags +faststart "$out"

          ffprobe -v error \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,bit_rate \
            -show_entries format=duration,size,bit_rate \
            -of default=nw=1 "$out"

      - name: Commit generated web hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin fix/topaz-hero-web-20260912
          git add stackblitz-starters-n2un17vw/public/media/hero_web_v10_topaz60_075x_seamless.mp4
          git commit -m "Add 0.75x web hero from Topaz 60fps master"
          git push
