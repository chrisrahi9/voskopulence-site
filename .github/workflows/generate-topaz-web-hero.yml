name: Generate Topaz web hero

on:
  push:
    branches:
      - fix/topaz-hero-web-20260912
    paths:
      - .github/workflows/generate-topaz-web-hero.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download Topaz master
        run: curl -L --fail --retry 3 https://vosko-cdn.b-cdn.net/hero_web_v4_enhanced.mp4 -o /tmp/hero_topaz_master.mp4
      - name: Build 1080p 0.60x 60fps seamless web version
        run: |
          mkdir -p stackblitz-starters-n2un17vw/public/media
          tmp="/tmp/hero_topaz_slow60_master.mp4"
          out="stackblitz-starters-n2un17vw/public/media/hero_web_v8_topaz_slow60.mp4"

          ffmpeg -y -i /tmp/hero_topaz_master.mp4 -an \
            -vf "scale=1920:1080:flags=lanczos,setpts=1.6666667*PTS,minterpolate=fps=60:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:me=epzs:mb_size=8:search_param=48:vsbmc=1" \
            -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p \
            -profile:v high -level 4.2 -movflags +faststart "$tmp"

          # Keep the same approved seamless-loop treatment as production.
          ffmpeg -y -i "$tmp" -an -filter_complex \
            "[0:v]split=3[a][b][c];\
             [a]trim=start=0.55:end=4.1667,setpts=PTS-STARTPTS[main];\
             [b]trim=start=4.1667:end=4.7167,setpts=PTS-STARTPTS[tail];\
             [c]trim=start=0:end=0.55,setpts=PTS-STARTPTS[head];\
             [tail][head]blend=all_expr='A*(1-T/0.55)+B*(T/0.55)':shortest=1[bridge];\
             [main][bridge]concat=n=2:v=1:a=0,fps=60[outv]" \
            -map "[outv]" -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p \
            -profile:v high -level 4.2 -movflags +faststart "$out"

          ffprobe -v error -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,bit_rate -show_entries format=duration,size,bit_rate -of default=nw=1 "$out"

      - name: Commit generated web hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin fix/topaz-hero-web-20260912
          git add stackblitz-starters-n2un17vw/public/media/hero_web_v8_topaz_slow60.mp4
          git commit -m "Add web-optimized Topaz hero"
          git push
