name: Build adaptive v6_3 HLS hero trial

on:
  push:
    branches:
      - trial-4k-hero-ladder
    paths:
      - .github/workflows/build-mobile-hero.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial-4k-hero-ladder

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl

      - name: Fetch original 4K master
        run: |
          curl -L --fail --retry 3 https://vosko-cdn.b-cdn.net/hero_web_v6_3.mp4 -o /tmp/hero_web_v6_3_original_4k.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=nw=1 /tmp/hero_web_v6_3_original_4k.mp4

      - name: Build 4K trial ladder
        run: |
          set -e
          OUT=stackblitz-starters-n2un17vw/public/hero_hls_v6_3_4k
          rm -rf "$OUT"
          mkdir -p "$OUT/2160p"

          ffmpeg -y -i /tmp/hero_web_v6_3_original_4k.mp4 -an \
            -filter_complex "[0:v]trim=start=1.2:end=10.662,setpts=PTS-STARTPTS[main];[0:v]trim=start=10.662:end=11.862,setpts=PTS-STARTPTS[tail];[0:v]trim=start=0:end=1.2,setpts=PTS-STARTPTS[head];[tail][head]xfade=transition=fade:duration=1.2:offset=0[blend];[main][blend]concat=n=2:v=1:a=0,fps=60000/1001,format=yuv420p[outv]" \
            -map "[outv]" -c:v libx264 -preset medium -profile:v high -level 5.2 \
            -b:v 12000k -maxrate 14000k -bufsize 24000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -hls_time 1 -hls_playlist_type vod -hls_flags independent_segments \
            -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 \
            -hls_segment_filename "$OUT/2160p/seg_%03d.m4s" \
            "$OUT/2160p/playlist.m3u8"

          printf '%s\n' \
            '#EXTM3U' \
            '#EXT-X-VERSION:7' \
            '#EXT-X-INDEPENDENT-SEGMENTS' \
            '#EXT-X-STREAM-INF:BANDWIDTH=14000000,AVERAGE-BANDWIDTH=12000000,RESOLUTION=3840x2160,FRAME-RATE=59.940,CODECS="avc1.640034"' \
            '2160p/playlist.m3u8' \
            '#EXT-X-STREAM-INF:BANDWIDTH=5800000,AVERAGE-BANDWIDTH=5200000,RESOLUTION=1920x1080,FRAME-RATE=59.940,CODECS="avc1.64002A"' \
            '/hero_hls_v6_3/1080p/playlist.m3u8' \
            '#EXT-X-STREAM-INF:BANDWIDTH=4500000,AVERAGE-BANDWIDTH=4000000,RESOLUTION=1600x900,FRAME-RATE=59.940,CODECS="avc1.64002A"' \
            '/hero_hls_v6_3/900p/playlist.m3u8' \
            '#EXT-X-STREAM-INF:BANDWIDTH=3200000,AVERAGE-BANDWIDTH=2800000,RESOLUTION=1280x720,FRAME-RATE=59.940,CODECS="avc1.640029"' \
            '/hero_hls_v6_3/720p/playlist.m3u8' \
            '#EXT-X-STREAM-INF:BANDWIDTH=1800000,AVERAGE-BANDWIDTH=1500000,RESOLUTION=960x540,FRAME-RATE=29.970,CODECS="avc1.64001F"' \
            '/hero_hls_v6_3/540p/playlist.m3u8' > "$OUT/master.m3u8"

      - name: Commit 4K trial assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A stackblitz-starters-n2un17vw/public/hero_hls_v6_3_4k
          git commit -m 'Build true 4K adaptive hero trial' || exit 0
          git pull --rebase origin trial-4k-hero-ladder
          git push origin HEAD:trial-4k-hero-ladder
