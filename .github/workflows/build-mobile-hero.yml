name: Build adaptive v6_3 HLS hero

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-mobile-hero.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build HLS ladder
        run: |
          set -e
          SRC=stackblitz-starters-n2un17vw/public/hero_web_v6_3_seamless.mp4
          OUT=stackblitz-starters-n2un17vw/public/hero_hls_v6_3
          rm -rf "$OUT"
          mkdir -p "$OUT/1080p" "$OUT/900p" "$OUT/720p" "$OUT/540p"

          ffmpeg -y -i "$SRC" -an \
            -vf "scale=1920:1080:flags=lanczos,fps=60000/1001,format=yuv420p" \
            -c:v libx264 -preset medium -profile:v high -level 4.2 \
            -b:v 6800k -maxrate 7600k -bufsize 12000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -hls_time 1 -hls_playlist_type vod -hls_flags independent_segments \
            -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 \
            -hls_segment_filename "$OUT/1080p/seg_%03d.m4s" \
            "$OUT/1080p/playlist.m3u8"

          ffmpeg -y -i "$SRC" -an \
            -vf "scale=1600:900:flags=lanczos,fps=60000/1001,format=yuv420p" \
            -c:v libx264 -preset medium -profile:v high -level 4.2 \
            -b:v 5000k -maxrate 5800k -bufsize 10000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -hls_time 1 -hls_playlist_type vod -hls_flags independent_segments \
            -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 \
            -hls_segment_filename "$OUT/900p/seg_%03d.m4s" \
            "$OUT/900p/playlist.m3u8"

          ffmpeg -y -i "$SRC" -an \
            -vf "scale=1280:720:flags=lanczos,fps=60000/1001,format=yuv420p" \
            -c:v libx264 -preset medium -profile:v high -level 4.1 \
            -b:v 3400k -maxrate 4000k -bufsize 7200k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -hls_time 1 -hls_playlist_type vod -hls_flags independent_segments \
            -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 \
            -hls_segment_filename "$OUT/720p/seg_%03d.m4s" \
            "$OUT/720p/playlist.m3u8"

          ffmpeg -y -i "$SRC" -an \
            -vf "scale=960:540:flags=lanczos,fps=30000/1001,format=yuv420p" \
            -c:v libx264 -preset medium -profile:v high -level 3.1 \
            -b:v 1700k -maxrate 2100k -bufsize 4200k \
            -g 30 -keyint_min 30 -sc_threshold 0 \
            -hls_time 1 -hls_playlist_type vod -hls_flags independent_segments \
            -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 \
            -hls_segment_filename "$OUT/540p/seg_%03d.m4s" \
            "$OUT/540p/playlist.m3u8"

          printf '%s\n' \
            '#EXTM3U' \
            '#EXT-X-VERSION:7' \
            '#EXT-X-INDEPENDENT-SEGMENTS' \
            '#EXT-X-STREAM-INF:BANDWIDTH=7600000,AVERAGE-BANDWIDTH=6800000,RESOLUTION=1920x1080,FRAME-RATE=59.940,CODECS="avc1.64002A"' \
            '1080p/playlist.m3u8' \
            '#EXT-X-STREAM-INF:BANDWIDTH=5800000,AVERAGE-BANDWIDTH=5000000,RESOLUTION=1600x900,FRAME-RATE=59.940,CODECS="avc1.64002A"' \
            '900p/playlist.m3u8' \
            '#EXT-X-STREAM-INF:BANDWIDTH=4000000,AVERAGE-BANDWIDTH=3400000,RESOLUTION=1280x720,FRAME-RATE=59.940,CODECS="avc1.640029"' \
            '720p/playlist.m3u8' \
            '#EXT-X-STREAM-INF:BANDWIDTH=2100000,AVERAGE-BANDWIDTH=1700000,RESOLUTION=960x540,FRAME-RATE=29.970,CODECS="avc1.64001F"' \
            '540p/playlist.m3u8' > "$OUT/master.m3u8"

          find "$OUT" -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Commit HLS assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A stackblitz-starters-n2un17vw/public/hero_hls_v6_3
          git commit -m 'Build smoother four-level adaptive hero ladder' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
