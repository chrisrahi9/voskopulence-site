name: Build lightweight mobile hero assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-mobile-hero.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render mobile hero and matching poster
        run: |
          ffmpeg -y \
            -i stackblitz-starters-n2un17vw/public/hero_web_v6_3_seamless.mp4 \
            -an -vf "scale=-2:720:flags=lanczos,fps=30000/1001,format=yuv420p" \
            -c:v libx264 -preset medium -profile:v high -level 3.1 \
            -b:v 3200k -maxrate 4000k -bufsize 8000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -movflags +faststart \
            stackblitz-starters-n2un17vw/public/hero_web_v6_3_mobile.mp4

          ffmpeg -y \
            -ss 0.05 -i stackblitz-starters-n2un17vw/public/hero_web_v6_3_seamless.mp4 \
            -frames:v 1 -vf "scale=1280:-2:flags=lanczos" -q:v 3 \
            stackblitz-starters-n2un17vw/public/hero_web_v6_3_poster.jpg

          ls -lh stackblitz-starters-n2un17vw/public/hero_web_v6_3_mobile.mp4 \
                 stackblitz-starters-n2un17vw/public/hero_web_v6_3_poster.jpg

      - name: Commit mobile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stackblitz-starters-n2un17vw/public/hero_web_v6_3_mobile.mp4 \
                  stackblitz-starters-n2un17vw/public/hero_web_v6_3_poster.jpg
          git commit -m 'Add lightweight mobile v6_3 hero assets' || exit 0
          git push origin HEAD:main
