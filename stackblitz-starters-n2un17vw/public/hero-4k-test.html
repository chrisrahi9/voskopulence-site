<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Voskopulence Stable 1440p Hero Test</title>
  <style>
    html,body{margin:0;height:100%;background:#004642;overflow:hidden;font-family:Arial,sans-serif}
    .wrap{position:fixed;inset:0;background:#004642}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:46% 50%;background:#004642}
    .shade{position:absolute;inset:0;background:rgba(0,0,0,.15);pointer-events:none}
    .diag{position:fixed;left:8px;bottom:8px;z-index:10;max-width:calc(100vw - 16px);padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.82);color:#fff;font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;pointer-events:none}
  </style>
</head>
<body>
  <div class="wrap">
    <video id="hero" autoplay muted loop playsinline preload="auto"></video>
    <div class="shade"></div>
  </div>
  <div id="diag" class="diag">HERO DIAGNOSTICS\nstable adaptive ladder loading…</div>
  <script>
    const v=document.getElementById('hero');
    const d=document.getElementById('diag');
    v.muted=true; v.defaultMuted=true; v.playsInline=true; v.loop=true;
    v.src='/hero_hls_v6_3_4k/master.m3u8';
    const play=()=>{const p=v.play(); if(p&&p.catch)p.catch(()=>{});};
    v.addEventListener('loadedmetadata',play); play();
    function quality(h){if(h>=1300)return '1440p';if(h>=1000)return '1080p';if(h>=840)return '900p';if(h>=650)return '720p';if(h>=500)return '540p';return h?h+'p':'waiting';}
    function update(){
      let ahead=0;
      try{for(let i=0;i<v.buffered.length;i++){if(v.buffered.start(i)<=v.currentTime&&v.buffered.end(i)>=v.currentTime){ahead=Math.max(0,v.buffered.end(i)-v.currentTime);break;}}}catch(e){}
      d.textContent='HERO DIAGNOSTICS\n'+
        'mode: ADAPTIVE (1440 / 1080 / 900 / 720 / 540)\n'+
        'decoded: '+(v.videoWidth&&v.videoHeight?v.videoWidth+'×'+v.videoHeight:'waiting')+'  ≈ '+quality(v.videoHeight)+'\n'+
        'state: '+(v.paused?'paused':'playing')+' / readyState '+v.readyState+'\n'+
        'buffer: '+ahead.toFixed(1)+'s ahead';
    }
    setInterval(update,250); update();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')play();});
  </script>
</body>
</html>
